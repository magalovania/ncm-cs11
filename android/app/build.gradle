plugins {
  id 'com.android.application'
}

android {
  namespace 'com.ncmcs11'
  compileSdk 34

  defaultConfig {
    applicationId "com.ncmcs11"
    minSdk 19
    targetSdk 34
    versionCode 12
    versionName "1.2.1"
  }

  sourceSets {
    main {
      // Bundle the lightweight web client for API 19; API calls still use the configured server.
      assets.srcDir '../../web'
    }
  }

  buildTypes {
    debug {
      minifyEnabled false
    }
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

// No external dependencies — pure Android framework APIs (WebView + MediaSession + Notification).
dependencies {
}
