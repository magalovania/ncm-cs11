services:
  # NeteaseCloudMusicApi Enhanced — official image (author's). No build needed.
  # To build from source instead: replace `image:` with `build: { context: .., dockerfile: server/Dockerfile.api }`
  api:
    image: moefurina/ncm-api:latest
    environment:
      ENABLE_GENERAL_UNBLOCK: "true"   # 全局解灰
      ENABLE_RANDOM_CN_IP: "true"      # 海外服务器伪造国内 IP，规避网易 460 cheating
    restart: unless-stopped

  # Gateway: serves web UI + proxies /api to the api service (same-origin, no CORS).
  web:
    build:
      context: ..
      dockerfile: server/Dockerfile.web
    ports:
      - "8080:8080"
    environment:
      API_HOST: "api"
      API_PORT: "3000"
      # Access gate — put GATE_KEY=<your-password> in server/.env (gitignored).
      # Without it the gateway stays open (only for trusted networks / dev).
      GATE_KEY: "${GATE_KEY}"
      DEBUG_UPLOAD_ENABLED: "${DEBUG_UPLOAD_ENABLED:-false}"
      DEBUG_ROOT: "/debug-screenshots"
    volumes:
      - ./debug-screenshots:/debug-screenshots
    depends_on:
      - api
    restart: unless-stopped
