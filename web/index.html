<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>车机网易云</title>
<link rel="stylesheet" href="?__ncm_asset=style.css">
</head>
<body>
<div id="app">
  <aside id="nav">
    <div class="nav-logo"><img src="?__ncm_asset=logo.png" alt=""></div>
    <button class="nav-btn" data-view="nowplaying" data-title="当前播放">当前播放</button>
    <button class="nav-btn active" data-view="playlists" data-title="我的歌单">歌单</button>
    <button class="nav-btn" data-view="fm" data-title="私人FM">FM</button>
    <button class="nav-btn" data-view="search" data-title="搜索">搜索</button>
    <button class="nav-btn nav-login" data-view="login" id="nav-login" data-title="登录">未登录</button>
  </aside>
  <main id="content"></main>
</div>

<div id="player-bar" hidden>
  <div id="pb-bar"><i id="pb-fill"></i></div>
  <img id="pb-cover" alt="" src="">
  <div id="pb-info">
    <div id="pb-title">-</div>
    <div id="pb-artist">-</div>
  </div>
  <div id="pb-progress"><span id="pb-cur">0:00</span> / <span id="pb-dur">0:00</span></div>
  <div class="pb-controls">
    <button id="pb-prev" class="ctrl"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
    <button id="pb-play" class="ctrl"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="pb-next" class="ctrl"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12H16z"/></svg></button>
  </div>
</div>

<audio id="audio" preload="auto"></audio>
<script src="?__ncm_asset=compat.js"></script>
<script src="?__ncm_asset=api.js"></script>
<script src="?__ncm_asset=app.js"></script>
<script src="?__ncm_asset=boot.js"></script>
</body>
</html>
